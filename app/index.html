<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=1920, initial-scale=1"><title>Inicio+</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="landscape"><div id="photoA" class="photo"></div><div id="photoB" class="photo"></div></div><div class="shade"></div>
<main id="home">
 <header><div id="greeting"></div><time id="clock"></time><div id="date"></div><div id="location">TU CIUDAD</div></header>
 <nav id="shortcuts" aria-label="Accesos"><div id="networkStatus" class="networkStatus" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8a16 16 0 0 1 20 0M5.5 11.5a11 11 0 0 1 13 0M9 15a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1"/></svg><div><span id="networkName">Consultando red…</span><small id="networkDetail">Conexión de la TV</small></div></div><button id="apple" class="glass shortcut">Mis canales</button><button id="settings" class="glass shortcut"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></svg>Ajustes</button></nav>
 <button id="weather" type="button" aria-label="Ver pronóstico de tu ciudad" aria-haspopup="dialog"><div class="weatherTop"><div id="weatherIcon" aria-hidden="true"></div><span id="weatherTemp">—°</span><div class="weatherPlace"><span id="weatherCity">Tu ciudad</span><small id="weatherCondition">Consultando clima…</small></div></div><div id="weatherDetails"></div><div id="weatherUpdated">Datos de Open-Meteo</div><span class="weatherHint">Pronóstico <span aria-hidden="true">›</span></span></button>
 <aside id="macWidget" aria-label="Estado del Mac"><div class="macHeading"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span id="macState">Conectando con el Mac…</span></div><div id="macStorage">Consultando espacio…</div><div id="macActivity">Consultando actividad…</div></aside>
 <section id="shelf" aria-label="Contenidos">
  <div id="tabs" role="tablist"><button id="appsTab" role="tab" aria-selected="true">Apps</button><button id="channelsTab" role="button" aria-label="Canales de televisión">Canales de TV <span aria-hidden="true">›</span></button><span id="syncStatus" role="status"></span></div>
  <div id="tray" class="glass"><div class="trayBlur blurA"></div><div class="trayBlur blurB"></div><div class="trayTint"></div><div id="railViewport"><div id="rail"></div></div></div>
  <button id="all">Ver todos <span aria-hidden="true">›</span></button>
 </section>
 <div id="photoLabel"></div>
</main>
<section id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="overlayTitle"><div class="overlayBlur blurA"></div><div class="overlayBlur blurB"></div><div class="overlayTint"></div><div class="overlayContent"><div class="overlayHeader"><div><p id="eyebrow">TU TELEVISIÓN</p><h1 id="overlayTitle"></h1><p id="overlaySubtitle"></p></div><button id="closeOverlay" class="glass">Volver</button></div><div id="overlayBody"></div></div></section>
<section id="preview" class="hidden" role="dialog" aria-modal="true" aria-label="Vista previa del paisaje"><div id="previewPhoto"></div><div class="previewShade"></div><div id="previewInfo"><p>VISTA PREVIA</p><h1 id="previewTitle"></h1><div id="previewCredit"></div><div id="previewActions"></div></div></section>
<div id="toast" role="status"></div>
<script src="config.js"></script><script src="config.local.js"></script><script src="connection.js"></script><script src="connection.local.js"></script><script src="inventory.js"></script><script src="inventory.local.js"></script><script src="landscapes.js"></script><script src="model.js"></script><script src="studio.js"></script><script src="native.js"></script><script src="wallpaper.js"></script><script src="app.js"></script><script src="weather-model.js"></script><script src="ambient.js"></script>
</body></html>
